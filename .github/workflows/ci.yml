name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-check:
    name: Test & Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Run unit tests
        run: bun run test

      - name: Build bundle routers
        run: bun run build

      - name: Verify the collection (hashes, superskills, README)
        run: bun run check

  impexcube-fill:
    name: impexcube-fill skill
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/impexcube-fill
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck, lint and test
        run: bun run check

  fact-check:
    name: Fact-check helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: |
          python -m pip install --only-binary=:all: 'markdown-it-py>=4,<5' 'jinja2>=3.1.6,<4'
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends graphviz
      - name: Test transcription and HTML helpers
        run: python -m unittest discover -s skills/fact-check/scripts -p 'test_*.py'
