name: Ditto helpers

on:
  push:
    branches: [main]
    paths: ['skills/ditto/**', '.github/workflows/ditto.yml']
  pull_request:
    paths: ['skills/ditto/**', '.github/workflows/ditto.yml']

jobs:
  helpers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test portable helpers
        run: python -m unittest discover -s skills/ditto/scripts -p "test_*.py"
