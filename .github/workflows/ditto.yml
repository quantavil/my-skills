name: Ditto helpers

on:
  push:
    branches: [main]
    paths: ['skills/ditto/**', '.github/workflows/ditto.yml']
  pull_request:
    paths: ['skills/ditto/**', '.github/workflows/ditto.yml']

jobs:
  helpers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Test portable helpers
        working-directory: skills/ditto
        run: uv run --locked python -m unittest discover -s tests -p "test_*.py"
